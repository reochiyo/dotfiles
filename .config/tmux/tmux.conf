# ==========================================
# 基本設定
# ==========================================
# 256色モードを有効にする
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# マウス操作を有効にする
set -g mouse on

# ステータスバーをトップではなくボトムに配置（デフォルトはボトムですが念のため）
set -g status-position bottom

# ステータスバーの更新間隔（秒）
set -g status-interval 1

# ==========================================
# デザイン設定 (Nord & Powerline)
# ==========================================

# 全体の背景色と文字色
set -g status-bg '#2E3440' # 背景: 黒に近いグレー
set -g status-fg '#D8DEE9' # 文字: 白に近いグレー

# 左側の設定 (セッション名など)
# [黒背景] セッション名 [矢印]
set -g status-left-length 50
set -g status-left "#[fg=#2E3440,bg=#88C0D0,bold] #S #[fg=#88C0D0,bg=#2E3440] "

# 右側の設定 (ホスト名や時刻)
# [矢印] ホスト名 [矢印] 時刻
set -g status-right-length 150
set -g status-right "#[fg=#88C0D0,bg=#2E3440]#[fg=#2E3440,bg=#88C0D0,bold] #h "

# ウィンドウのステータス設定
# 非アクティブなウィンドウ
setw -g window-status-format "#[fg=#2E3440,bg=#2E3440]#[fg=#D8DEE9,bg=#2E3440] #I: #W #[fg=#2E3440,bg=#2E3440]"

# アクティブなウィンドウ (ここを目立たせる: 黄色背景)
setw -g window-status-current-format "#[fg=#2E3440,bg=#EBCB8B]#[fg=#2E3440,bg=#EBCB8B,bold] #I: #W #[fg=#EBCB8B,bg=#2E3440]"

# ステータスバーの配置を左寄せに
set -g status-justify left

# プレフィックス + H, J, K, L でリサイズ（5ずつ変化）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

